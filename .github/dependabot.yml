version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mineures:
        update-types: [minor, patch]
    ignore:
      # Electron : montée de version majeure à faire à la main (electronVersion dans electron-builder.json).
      - dependency-name: electron
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
