name: Applications de bureau

# Construit les installateurs Windows, macOS et Linux.
# - push sur main / pull request : installateurs disponibles dans les artefacts de l'exécution ;
# - tag v* : publiés dans une version GitHub (Releases).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            flag: --win
            artifact: Automatisation-Mail-Windows
          - name: macOS
            os: macos-latest
            flag: --mac
            artifact: Automatisation-Mail-macOS
          - name: Linux
            os: ubuntu-latest
            flag: --linux
            artifact: Automatisation-Mail-Linux
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Préparer l'application (base embarquée, API, moteur, interface)
        run: pnpm --filter @am/desktop stage

      - name: Test de bout en bout
        run: pnpm --filter @am/desktop smoke

      - name: Construire les installateurs
        working-directory: apps/desktop
        run: npx electron-builder --config electron-builder.json ${{ matrix.flag }} --publish never
        env:
          # Pas de certificat de signature : voir docs/applications.md.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: error

  release:
    name: Publier la version
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sommes de contrôle
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
