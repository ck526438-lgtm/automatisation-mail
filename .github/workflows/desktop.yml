name: Applications de bureau

# Construit les installateurs Windows, macOS et Linux.
# - pull request : installateurs disponibles dans les artefacts de l'exécution ;
# - push sur main : publiés dans une version GitHub (Releases) si le numéro de version est nouveau.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            flag: --win
            archs: x64
            artifact: Automatisation-Mail-Windows
          - name: macOS
            os: macos-latest
            flag: --mac
            archs: arm64 x64
            artifact: Automatisation-Mail-macOS
          - name: Linux
            os: ubuntu-latest
            flag: --linux
            archs: x64
            artifact: Automatisation-Mail-Linux
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Préparer l'application (base embarquée, API, moteur, interface)
        run: pnpm --filter @am/desktop stage

      - name: Test de bout en bout
        run: pnpm --filter @am/desktop smoke

      - name: Construire les installateurs
        working-directory: apps/desktop
        shell: bash
        # Une architecture à la fois : sur macOS, deux créations de .dmg en parallèle font échouer hdiutil.
        run: |
          for arch in ${{ matrix.archs }}; do
            npx electron-builder --config electron-builder.json ${{ matrix.flag }} --$arch --publish never
          done
        env:
          # Pas de certificat de signature : voir docs/applications.md.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: error

  # Publie une version GitHub (tag + installateurs) :
  # - à chaque push sur main dont la version (apps/desktop/package.json) n'a pas encore été publiée ;
  # - ou quand un tag v* est poussé à la main.
  release:
    name: Publier la version
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version à publier
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./apps/desktop/package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "La version $tag est déjà publiée : rien à faire."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Sommes de contrôle
        if: steps.version.outputs.publish == 'true'
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Automatisation Mail ${{ steps.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
