name: Application Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Préparer l'application (base embarquée, API, moteur, interface)
        run: pnpm --filter @am/desktop stage

      - name: Test de bout en bout sous Windows
        run: pnpm --filter @am/desktop smoke

      - name: Construire l'installateur
        working-directory: apps/desktop
        run: npx electron-builder --config electron-builder.json --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Automatisation-Mail-Windows
          path: apps/desktop/dist/*.exe
          if-no-files-found: error

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/dist/*.exe
          generate_release_notes: true
