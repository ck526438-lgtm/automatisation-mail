<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hors connexion — Automatisation Mail</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f8fb; color: #18233d; }
  main { text-align: center; padding: 24px; max-width: 360px; }
  img { width: 96px; height: 96px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #5d6882; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  button { font: inherit; font-size: 14px; padding: 10px 18px; border-radius: 8px; border: 0; background: #1f5fbf; color: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) { body { background: #0f1524; color: #e7ebf3; } p { color: #9aa5bd; } }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Vous êtes hors connexion</h1>
  <p>Vos séquences continuent de tourner sur le serveur. Reconnectez-vous à Internet pour retrouver votre tableau de bord.</p>
  <button onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
